	updateExpense(id: ID!, input: ExpenseInput!): Expense!
	"""
	Delete an expense, returning its id. Refused (`CONFLICT`) while it
	is re-billed — delete the billable item `rebillExpense` made first.
	"""
	deleteExpense(id: ID!): ID!
	"""
	Create a draft invoice from a project's unbilled items, in one
	transaction (`db::Handler::create_invoice`). Authorised through the
	project like `createBillableItem` — `NOT_FOUND` for a missing
	project or a non-member alike; an archived project is allowed (you
	may be invoicing final work on a job you've since archived). Every
	id in `itemIds` must belong to this project and be currently
	unbilled (`CONFLICT`/`NOT_FOUND` otherwise), 1–50 of them
	(`MAX_INVOICE_ITEMS`), no duplicates.
	"""
	createInvoice(projectId: ID!, itemIds: [ID!]!): Invoice!
	"""
	Add unbilled items to a draft invoice, in one transaction
	(`db::Handler::add_invoice_items`) that also bumps the invoice's
	`version`. `NOT_FOUND`/`CONFLICT` for the same reasons as
	`createInvoice`; `CONFLICT` if the invoice is already finalized, or
	changed concurrently (a stale `version`).
	"""
	addInvoiceItems(invoiceId: ID!, itemIds: [ID!]!): Invoice!
	"""
	Remove items from a draft invoice, in one transaction
	(`db::Handler::remove_invoice_items`) that also bumps the invoice's
	`version`. Removing every item (an empty draft) is allowed —
	finalizing one is not. `CONFLICT` if the invoice is finalized, an id
	isn't currently on it, or the invoice changed concurrently.
	"""
	removeInvoiceItems(invoiceId: ID!, itemIds: [ID!]!): Invoice!
	"""
	Delete a draft invoice, returning its id. Draft only — a `Delete` on
	the invoice plus `REMOVE invoice_id` on each of its items, in one
	transaction (`db::Handler::delete_invoice`) conditioned on the
	`version` this resolver just read.
	"""
	deleteInvoice(invoiceId: ID!): ID!
	"""
	Finalize a draft invoice — CLAUDE.md's "finalize algorithm", steps
	1–6: re-read the items this resolver's `require_invoice_member`
	fetch named (consistently, so this sees each item's just-attached
	`invoice_id`), read the project and instance (requiring
	`businessName` to be set), allocate the next number from the
	per-instance counter, build the frozen snapshot, and write it all in
	one conditional transaction with the number's reservation row
	(`db::Handler::finalize_invoice`). Strictly final — no void, no
	un-finalize; only `setInvoicePaid` may touch a finalized invoice
	afterward. `CONFLICT` if the draft changed concurrently (a stale
	`version`, checked both up front — via the consistent items read —
	and in the final write's own condition).
	
	`issueDate` may be any valid date, past or future — backdating is how
	an existing invoice is imported as it was issued. `number`, when given,
	replaces step 4's counter allocation with exactly that number — for
	importing an invoice under its original number. Owner-only, like
	`setNextInvoiceNumber`, since it can move the same counter. Any number
	no invoice in the instance already has is accepted, lower than the
	counter or not; a used one is `CONFLICT`, and the invoice stays a
	draft. A number above the counter moves the counter up to it first,
	so automatic numbering never runs into it. The guarantee against a
	duplicate is the number's reservation row, written in the same
	transaction as the finalize (`db::Handler::finalize_invoice`).
	
	`dueDate` (`YYYY-MM-DD`, on or after `issueDate`) defaults to
	`issueDate` + the project's payment terms (else the instance's, else
	14 days); it is frozen onto the row and printed on the invoice.
	"""
	finalizeInvoice(invoiceId: ID!, issueDate: String!, number: Int, dueDate: String): Invoice!
	"""
	Mark a finalized invoice paid in full on `paidDate` — a shortcut for
	`recordInvoicePayment` of its whole remaining balance — or, with
	`null`, remove every payment recorded against it. `CONFLICT` on a
	draft, when `paidDate` is given but nothing is owed, or if the
	invoice changed concurrently.
	"""
	setInvoicePaid(invoiceId: ID!, paidDate: String): Invoice!
	"""
	Record a payment received against a finalized invoice: `amountCents`
	(GST-inclusive, > 0, no more than the balance owing) on `date`. When
	it settles the balance the invoice becomes PAID, dated by the latest
	payment. `CONFLICT` on a draft, an already-settled invoice, or a
	concurrent change.
	"""
	recordInvoicePayment(invoiceId: ID!, input: RecordPaymentInput!): Invoice!
	"""
	Remove one recorded payment (a mistake, a bounced transfer). The
	invoice goes back to UNPAID if that leaves anything owing.
	`NOT_FOUND` for a payment id not on this invoice.
	"""
	deleteInvoicePayment(invoiceId: ID!, paymentId: ID!): Invoice!
	"""
	**Sends email.** Mail a finalized invoice to the client with its PDF
	attached: to `input.to` (default: the project's client email) and
	`input.cc`, at most 10 in total, with an optional covering
	`message`. Sent from the system sender under the business name, with
	`Reply-To` the business email — see `invoicing::send`. Sending is
	this mutation's whole point, so a send failure fails it (nothing is
	recorded); on success `sentAt`/`sentTo` are updated. Can be sent
	again (a reminder). `CONFLICT` on a draft.
	"""
	sendInvoice(invoiceId: ID!, input: SendDocumentInput! = {to: [], cc: [], message: null}): Invoice!
	"""
	Download a finalized invoice's PDF: a presigned URL with
	`Content-Disposition: attachment; filename="Invoice-{displayNumber}.pdf"`
	(`storage::Handler::presign_get_download`, filename sanitised there).
	`CONFLICT` on a draft — finalization is what freezes the content a
	PDF prints (CLAUDE.md's "Invoicing" house rule), so there's nothing
	yet to render.
	
	This is a mutation, not a query, because the *first* call for a
	given invoice writes: it renders the frozen `snapshot` (the only input
	`invoicing::pdf::render_invoice_pdf` reads), stores it, and caches the
	key on the row (`db::Handler::set_invoice_pdf_key`). Every later call
	presigns the cached key. Rendering is deterministic from the snapshot,
	so two callers racing the first render each store a correct PDF of
	the same invoice — see `invoicing::pdf`'s doc comment.
	"""
	downloadInvoicePdf(invoiceId: ID!): String!
	"""
	**Irreversible.** Issue a credit note (an adjustment note, when the
	invoice was a tax invoice) against a finalized invoice: numbered from
	its own `CN-` sequence, frozen at once, and never editable or
	deletable — the correction for a finalized invoice, which itself can
	never change. `input.lines` are GST-exclusive amounts to credit;
	omit them to credit the whole invoice (only while nothing has been
	credited against it). The credit note's total (with GST, at the
	invoice's own GST registration) can't exceed what's left
	uncredited. The invoice's balance drops by that total, and if that
	settles it, it becomes PAID as of the credit note's date. Any member;
	sends no email (see `sendCreditNote`). `CONFLICT` on a draft or a
	concurrent change.
	"""
	issueCreditNote(invoiceId: ID!, input: CreditNoteInput!): CreditNote!
	"""
	Download a credit note's PDF — `downloadInvoicePdf`'s twin: rendered
	from the frozen snapshot on first call, cached after.
	"""
	downloadCreditNotePdf(creditNoteId: ID!): String!
	"""
	**Sends email.** `sendInvoice` for a credit note: mails it with its
	PDF to `input.to` (default: the project's client email) and `cc`.
	"""
	sendCreditNote(creditNoteId: ID!, input: SendDocumentInput! = {to: [], cc: [], message: null}): CreditNote!
	"""
	Re-bill an expense to its project's client: create an UNBILLED
	billable item for its GST-exclusive cost plus `markupPercent`
	(default 0, at most 1000, 2 dp), dated like the expense, linked to it
	so it can't be billed twice. `description` defaults to the
	expense's category and supplier. `gstFree` (default `false`) marks
	the new line GST-free. Refused for an expense with no project, on an
	archived project, or already re-billed (`CONFLICT`). Deleting the
	item frees the expense to be re-billed again.
	"""
	rebillExpense(expenseId: ID!, markupPercent: String, description: String, gstFree: Boolean! = false): BillableItem!
	"""
	Mint a presigned PUT for an expense's receipt, at
	`receipts/{instanceId}/{expenseId}/{random}/{filename}`. Upload the
	file there, then call `attachExpenseReceipt` with the returned key.
	"""
	createExpenseReceiptUpload(expenseId: ID!, filename: String!, contentType: String!): AttachmentUpload!
	"""
	Attach an uploaded receipt (a key from `createExpenseReceiptUpload`
	for this same expense) to the expense, replacing any earlier one.
	Refused for a key belonging to another expense, a file that wasn't
	uploaded, or one over 20 MB.
	"""
	attachExpenseReceipt(expenseId: ID!, key: String!, contentType: String!): Expense!
	"""
	Detach an expense's receipt.
	"""
	removeExpenseReceipt(expenseId: ID!): Expense!
	"""
	A presigned download URL for an expense's receipt. `NOT_FOUND` when
	it has none.
	"""
	downloadExpenseReceipt(expenseId: ID!): String!
	"""
	Owner-or-superuser: set the next invoice number to be assigned by
	`finalizeInvoice` (`db::Handler::set_next_invoice_number` writes
	`next - 1` to the counter). Forward-only — `CONFLICT` if `next`
	would move the counter backward. `next` must be at least 1.
	"""
	setNextInvoiceNumber(instanceId: ID!, next: Int!): Instance!
}

"""
A member's five staff-notification preferences, exposed over GraphQL as
`NotificationSettings` — see `db::NotificationSettings`'s doc comment for
what each field means and what it defaults to when never explicitly set.
"""
type NotificationSettings {
	newTicket: Boolean!
	assignedToMe: Boolean!
	assignedToMeUpdated: Boolean!
	unassignedUpdated: Boolean!
	assignedToOthersUpdated: Boolean!
}

"""
`updateNotificationSettings`'s argument — a patch over
[`db::NotificationSettingsPatch`]: every field optional, `null`/omitted
meaning "leave this one alone". See that type's doc comment.
"""
input NotificationSettingsInput {
	newTicket: Boolean
	assignedToMe: Boolean
	assignedToMeUpdated: Boolean
	unassignedUpdated: Boolean
	assignedToOthersUpdated: Boolean
}

"""
What the OAuth consent screen needs to show before a user approves or denies
an authorization request: the client's self-claimed name, and — the one
value that actually matters, since dynamic client registration is
unauthenticated — the host it will redirect back to.
"""
type OauthAuthorizationRequest {
	clientName: String!
	redirectHost: String!
}

type OauthGrant {
	id: ID!
	clientName: String!
	"""
	Host the client's tokens redirect back to. Shown alongside the
	(unauthenticated, self-claimed) client name, same as on the consent
	screen.
	"""
	redirectHost: String!
	scope: String!
	createdAt: Int!
	lastUsedAt: Int
	"""
	When this grant's refresh token stops working if it's never used
	again. Sliding: it moves out on every refresh, up to the grant's
	absolute cap (not exposed — a grant in active use never approaches it).
	"""
	refreshExpiresAt: Int!
}

"""
Information about pagination in a connection
"""
type PageInfo {
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
}

type PasskeyChallenge {
	challengeId: String!
	optionsJson: String!
}

"""
Metadata for a stored passkey credential — never the credential itself (no
private key material, no raw `passkey_json`).
"""
type PasskeyInfo {
	id: String!
	name: String!
	createdAt: Int!
	lastUsedAt: Int
}

type Project {
	id: ID!
	"""
	Dataloaded — see [`TicketMessage::author`]'s doc comment.
	"""
	instance: Instance!
	name: String!
	clientName: String!
	clientAbn: String
	clientAddress: String
	reference: String
	clientEmail: String
	"""
	This project's own payment terms override; `null` means the
	instance's apply — see `effectivePaymentTermsDays`.
	"""
	paymentTermsDays: Int
	"""
	The terms this project's invoices actually get: its own override,
	else the instance's.
	"""
	effectivePaymentTermsDays: Int!
	"""
	GST-exclusive cents a new billable item gets when it names no price.
	"""
	defaultUnitPriceCents: Int
	"""
	What this project has invoiced, been paid, and cost — computed from
	every finalized invoice, expense and unbilled item on it. Reads all
	of them, so ask for it on one project at a time, not on a list.
	"""
	financials: ProjectFinancialsInfo!
	archived: Boolean!
	createdAt: Int!
	updatedAt: Int!
}

"""
`Project.financials`. Everything GST-exclusive except where named.
"""
type ProjectFinancialsInfo {
	"""
	Finalized invoices, net of credit notes.
	"""
	invoicedCents: Int!
	invoicedInclGstCents: Int!
	paidCents: Int!
	outstandingCents: Int!
	expensesCents: Int!
	"""
	Billable items not yet on any invoice.
	"""
	unbilledCents: Int!
	"""
	Invoiced − expenses.
	"""
	profitCents: Int!
}

"""
One instance, exposed publicly and unauthenticated via `publicInstances` —
**only** the name and slug, so nothing else about a tenant (its inbound
addresses, its members, whether it even has any) leaks to an anonymous
caller browsing `/submit`.
"""
type PublicInstance {
	name: String!
	slug: String!
}

type QueryRoot {
	"""
	Look up an OAuth client + redirect URI before showing the consent
	screen. Deliberately returns nothing about the client beyond its
	(self-claimed, since registration is unauthenticated) name and the
	redirect host — the consent page shows the host prominently precisely
	because the name alone can't be trusted. A signed-in `User` only: a
	`Requester` capability token is not someone who can grant access.
	"""
	oauthAuthorizationRequest(clientId: String!, redirectUri: String!): OauthAuthorizationRequest!
	"""
	API build version — the git commit this server was built from.
	"""
	version: String!
	"""
	The authenticated caller's own user record. Guarded on `Authenticated`
	(the only requirement Toolbox's guard enum offers that fits a "must
	have *some* credential" query), but only a `User` principal actually has
	a record to return — a `Requester` capability token hits the explicit
	error below rather than some confusing "not found".
	"""
	me: User!
	"""
	Resolve a slug (from a URL: `/app/:slug`) to the full instance record.
	Requires *some* authenticated user (checked here, not via a static
	`#[graphql(guard)]`, since the guard's `Member(instance_id)` requirement
	needs an instance id this resolver only learns after resolving the
	slug) and, once resolved, that the caller is actually a member of that
	instance. A slug that doesn't resolve, or that resolves to an instance
	the caller isn't a member of, is reported identically — `None` — so a
	non-member can't use this to probe which slugs exist.
	"""
	instance(slug: String!): Instance
	"""
	Every instance with public ticket submission enabled — the bare
	`/submit` list. Unauthenticated by design (this is how an anonymous
	visitor finds which organisations accept public tickets), and
	deliberately exposes only `name`/`slug`: see [`PublicInstance`]'s doc
	comment for why nothing else about a tenant may leak here.
	"""
	publicInstances: [PublicInstance!]!
	"""
	One of the four ticket listing views, as a Relay connection ordered
	newest-activity-first. `status` defaults to `OPEN`; `DELETED` is
	owner-only (the explicit way to reach a soft-deleted ticket) —
	checked here, not by a static guard, since it depends on the `status`
	argument's value. `assignedTo`, when given, takes priority over
	`status`'s usual GSI choice and queries `instance_assignee` instead,
	narrowed by `status` via a `FilterExpression` when it isn't `ALL` (see
	`db::TicketListFilter`'s doc comment).
	
	**No `search` argument.** The build plan's schema sketch shows one,
	but DynamoDB cannot do a text search without a table scan, and a
	bounded post-filter (fetch a page, then filter in memory) would look
	like search while silently missing matches outside that page — worse
	than not having it. Left out of the schema; see `SCHEMA.md` for the
	same note next to the `ticket` table.
	"""
	tickets(instanceId: ID!, status: TicketStatusFilterType! = OPEN, assignedTo: ID, after: String, before: String, first: Int, last: Int): TicketConnection!
	"""
	Fetch a single ticket by id. Reachable by a member of its instance, or
	by the `Requester` who opened it (matching `instance_id` *and*
	`requester_emails`) — see [`Ticket`]'s doc comment for why a
	`Requester` can reach this at all. Anyone else — including a member of
	a *different* instance, or a requester who isn't on this ticket —
	gets `null`, identically to a nonexistent id, so this can't be used to
	probe which ticket ids exist in another instance.
	"""
	ticket(id: ID!): Ticket
	"""
	Every project for an invoicing instance, sorted by name
	case-insensitively — the projects list page's data source.
	Unpaginated, like `Instance.inboundAddresses` (see
	`db::Handler::list_projects_by_instance`'s doc comment for why).
	Rejects a support instance with a plain validation error — the caller
	is a real member of a real instance, just the wrong kind, unlike
	`addInboundAddress`'s "treat as not found" posture for the opposite
	direction.
	"""
	projects(instanceId: ID!, includeArchived: Boolean! = false): [Project!]!
	"""
	Fetch a single project by id. Reachable only by a member of its
	(invoicing) instance — a project that doesn't exist, belongs to an
	instance the caller isn't a member of, or belongs to a support
	instance, is reported identically — `null` — mirroring
	[`Self::ticket`]'s no-probing posture.
	"""
	project(id: ID!): Project
	"""
	Billable items in an invoicing instance — every project's, or one
	project's when `projectId` is given — as a Relay connection, newest
	`date` first (see `db::Handler::list_billable_items`). Forward-only
	(`first`/`after`). Member of `instanceId`; a support instance is
	rejected with a plain validation error (like `projects`), and a
	`projectId` that doesn't exist or belongs to another instance is
	`NOT_FOUND` either way. Superusers get nothing — they don't pass
	`Member`.
	"""
	billableItems(instanceId: ID!, projectId: ID, filter: BillableItemFilterType! = ALL, first: Int, after: String): BillableItemConnection!
	"""
	Expenses in an invoicing instance — all of them, or one project's
	when `projectId` is given — as a Relay connection, newest `date`
	first. Same posture as [`Self::billable_items`]: member of
	`instanceId`, support instance rejected with a plain validation
	error, `projectId` from another instance is `NOT_FOUND`, superusers
	get nothing. `category` narrows to one category.
	"""
	expenses(instanceId: ID!, projectId: ID, category: ExpenseCategoryType, first: Int, after: String): ExpenseConnection!
	"""
	The caller's own cents-per-km trips in `instanceId` for one
	financial year (`financialYear` is the year it starts in; defaults to
	the current one, by UTC date) against the ATO's 5,000 km cap.
	Self-only by construction — it only ever sums the caller's trips,
	since the cap applies per person. Member; support instance rejected
	like `expenses`.
	"""
	vehicleKmSummary(instanceId: ID!, financialYear: Int): VehicleKmSummary!
	"""
	Invoices in an invoicing instance — every project's, or one
	project's when `projectId` is given — as a Relay connection, newest
	`createdAt` first (see `db::Handler::list_invoices`). Same posture as
	[`Self::billable_items`]: member of `instanceId`, support instance
	rejected with a plain validation error, `projectId` from another
	instance is `NOT_FOUND`, superusers get nothing.
	"""
	invoices(instanceId: ID!, projectId: ID, filter: InvoiceFilterType! = ALL, first: Int, after: String): InvoiceConnection!
	"""
	Fetch a single invoice by id. Reachable only by a member of its
	(invoicing) instance — missing, wrong instance, and belonging to a
	support instance are all reported identically — `null` — mirroring
	[`Self::project`]'s no-probing posture. A strongly consistent
	`GetItem` (`get_invoice_consistent`), not the dataloader path: the web
	app navigates straight here right after `createInvoice`/
	`finalizeInvoice`, so an eventually consistent read could still show
	"not found" for an invoice this same request just created.
	"""
	invoice(id: ID!): Invoice
	"""
	Credit notes in an invoicing instance — all of them, or one
	invoice's when `invoiceId` is given — as a Relay connection, newest
	first. Same posture as [`Self::invoices`].
	"""
	creditNotes(instanceId: ID!, invoiceId: ID, first: Int, after: String): CreditNoteConnection!
	"""
	One credit note by id — `null` for missing, not-yours and a support
	instance alike, like [`Self::invoice`].
	"""
	creditNote(id: ID!): CreditNote
	"""
	The BAS figures for `from..=to` (`YYYY-MM-DD`, at most 2 years
	apart): sales and GST on sales (G1/1A) from finalized invoices,
	credit notes and payments on the chosen `basis`, and purchases and
	GST on purchases (1B) from expenses by their date. See
	`invoicing::report::gst_summary` for exactly how each basis counts.
	Member; a support instance is rejected.
	"""
	gstReport(instanceId: ID!, from: String!, to: String!, basis: ReportBasisType!): GstReport!
	"""
	Aged receivables: every finalized invoice with a balance owing,
	bucketed by days past due as of today (UTC). Member; a support
	instance is rejected.
	"""
	receivables(instanceId: ID!): ReceivablesReport!
	"""
	A CSV export for `from..=to` (`YYYY-MM-DD`, at most 2 years apart):
	finalized invoices by issue date, credit notes by issue date,
	payments by payment date, or expenses by date. Returned as the CSV
	text itself; the web app saves it as a file. Member; a support
	instance is rejected. See `invoicing::csv`.
	"""
	invoicingExport(instanceId: ID!, kind: CsvExportType!, from: String!, to: String!): String!
	"""
	Every instance, **including soft-deleted ones**, sorted by name — the
	admin instance list. Superuser-only; unlike every other way an
	`Instance` is reached, this deliberately does not filter `deleted`
	out, since restoring a deleted instance is exactly what this list is
	for. A superuser reaching an instance this way still gets no ticket
	access to it — see `CLAUDE.md`'s superuser boundary house rule; this
	query and `adminInstance` expose settings-shaped data only
	(`Instance`'s own fields, `inboundAddresses`, `members`), never a
	`tickets`/`ticket` path, because `Instance` has none.
	"""
	adminInstances: [Instance!]!
	"""
	One instance by id, including a soft-deleted one; `null` if no
	instance has that id at all. Superuser-only — see
	[`Self::admin_instances`]'s doc comment.
	"""
	adminInstance(id: ID!): Instance
	"""
	Every user, sorted by email — the admin user list. Superuser-only.
	"""
	adminUsers: [User!]!
	"""
	One user by id; `null` if no user has that id. Superuser-only. The
	returned `User`'s `memberships` field is how the admin user page
	shows which instances this user belongs to and in what role — see
	[`User::memberships`]'s doc comment for why that field, not a
	separate superuser-only one, is reused here. `passkeys` stays
	self-only even when reached this way — see that field's doc comment.
	"""
	adminUser(id: ID!): User
}

type ReceivablesReport {
	"""
	`YYYY-MM-DD` — the (UTC) date the buckets are measured from.
	"""
	asOf: String!
	currency: String!
	totalCents: Int!
	"""
	Not yet due.
	"""
	currentCents: Int!
	days1To30Cents: Int!
	days31To60Cents: Int!
	days61To90Cents: Int!
	daysOver90Cents: Int!
	"""
	Every invoice with a balance owing, most overdue first.
	"""
	invoices: [Invoice!]!
}

"""
`recordInvoicePayment`'s argument.
"""
input RecordPaymentInput {
	"""
	`YYYY-MM-DD` — when the money arrived.
	"""
	date: String!
	"""
	GST-inclusive cents, > 0 and no more than the invoice's balance.
	"""
	amountCents: Int!
	note: String
}

"""
`gstReport`'s basis.
"""
enum ReportBasisType {
	"""
	By payment date, GST apportioned per payment.
	"""
	CASH
	"""
	By issue date.
	"""
	ACCRUAL
}

"""
`sendInvoice`/`sendCreditNote`'s argument. An empty `to` means the
project's client email.
"""
input SendDocumentInput {
	to: [String!]! = []
	cc: [String!]! = []
	"""
	An optional covering note, put above the summary in the email.
	"""
	message: String
}

"""
`submitVerifiedTicket`'s result — deliberately narrow, not `Ticket<A>`:
an integration token has no business reading back ticket internals
(assignee, messages, internal notes) through nested fields just because
it opened the ticket. `subject_tag` is the `[#{slug}-{number}]` tag
`outbound::tag_subject` stamps on every outbound message for this
ticket, handed back so the caller can recognize its own ticket in a
downstream inbox without a second query.
"""
type SubmittedTicket {
	id: ID!
	number: Int!
	subjectTag: String!
}

type Ticket {
	id: ID!
	instanceId: ID!
	"""
	Dataloaded — see [`TicketMessage::author`]'s doc comment for why this
	matters on a list page (a page of tickets across several instances,
	once cross-instance views exist, would otherwise N+1).
	"""
	instance: Instance!
	number: Int!
	subject: String!
	status: TicketStatusType!
	requesterEmails: [String!]!
	ccEmails: [String!]!
	assigneeUserId: ID
	"""
	Dataloaded — see [`TicketMessage::author`]'s doc comment.
	"""
	assignee: User
	createdAt: Int!
	updatedAt: Int!
	lastActivityAt: Int!
	"""
	Whether any message in this ticket's thread carries an attachment.
	
	Denormalised onto the ticket precisely so a list row can show a
	paperclip without fetching `messages { attachments }` for every row on
	the page — that is one extra query per ticket, on the screen agents
	spend their day on.
	"""
	hasAttachments: Boolean!
	"""
	Every message on this ticket, oldest first — the thread view's data
	source. **Internal notes (`kind: NOTE`) are filtered out for anyone
	but a member of this ticket's instance** — enforced here, not only in
	the web UI, per the build plan's hard requirement that a note must
	never be visible to a requester. A caller who is neither a member of
	this instance nor the requester who opened this specific ticket gets
	`FORBIDDEN`, not a filtered (possibly empty) list — this field must
	not become a way to probe whether a ticket id exists.
	"""
	messages: [TicketMessage!]!
}

type TicketConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [TicketEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Ticket!]!
}

"""
An edge in a connection.
"""
type TicketEdge {
	"""
	The item at the end of the edge
	"""
	node: Ticket!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

type TicketMessage {
	id: ID!
	ticketId: ID!
	kind: TicketMessageKindType!
	authorUserId: ID
	"""
	The message's author, for `reply`/`note` messages — `null` for
	`inbound`/`system`. Dataloaded (see `graphql::dataloader`): a thread
	with several staff replies resolves every author in one `BatchGetItem`,
	not one per message.
	"""
	author: User
	fromEmail: String
	toEmails: [String!]!
	ccEmails: [String!]!
	bodyText: String
	bodyHtml: String
	rfcMessageId: String
	inReplyTo: String
	createdAt: Int!
	attachments: [Attachment!]!
}

"""
`ticket_message.kind`, exposed over GraphQL.
"""
enum TicketMessageKindType {
	INBOUND
	REPLY
	NOTE
	SYSTEM
}

"""
`tickets(status:)`'s filter — a superset of [`TicketStatusType`] with
`ALL` (every non-deleted ticket, the `instance_visible` GSI). `DELETED` is
the explicit, owner-only way to reach deleted tickets — enforced in the
`tickets` resolver, not by the schema.
"""
enum TicketStatusFilterType {
	OPEN
	CLOSED
	ALL
	DELETED
}

"""
`ticket.status`, exposed over GraphQL. Also `setTicketStatus`'s argument
type — deleting/restoring a ticket is just `setTicketStatus(DELETED)` /
`setTicketStatus(OPEN)`, not a separate mutation, since the three states
are exactly `TicketStatus`'s three variants.
"""
enum TicketStatusType {
	OPEN
	CLOSED
	DELETED
}

"""
`updateProject`'s argument — full-replace, including `archived`: an
omitted optional field is cleared.
"""
input UpdateProjectInput {
	name: String!
	clientName: String!
	clientAbn: String
	clientAddress: String
	clientEmail: String
	reference: String
	paymentTermsDays: Int
	defaultUnitPriceCents: Int
	archived: Boolean!
}

type User {
	id: ID!
	email: String!
	name: String!
	enabled: Boolean!
	createdAt: Int!
	accessTime: Int
	"""
	Mirrors `db::User::superuser`. Readable on any `User` object (not
	self-guarded like [`Self::passkeys`]) — knowing *whether* someone is
	a superuser is not itself sensitive the way passkey credential
	metadata is, and the admin user list needs to show it for every row.
	It cannot be *set* over GraphQL either way — see
	`db::User::superuser`'s doc comment.
	"""
	isSuperuser: Boolean!
	"""
	The caller's own registered passkeys. **Self only**: now that
	`adminUser` lets a superuser look up any user's record, this can no
	longer rely on the only path to a `User` object being `me` — a
	superuser fetching someone else's passkey *metadata* (registration
	time, credential id) would still be a real information leak, even
	though it carries no private key material. `FORBIDDEN`, not an empty
	list, for anyone but the user themselves (including a superuser) —
	an empty list would be indistinguishable from "this user has no
	passkeys" and invite exactly the kind of admin-lookup probing this
	guard exists to prevent.
	"""
	passkeys: [PasskeyInfo!]!
	"""
	The caller's own "connected AI apps" (OAuth grants), newest first.
	**Self only**, exactly like [`Self::passkeys`] and for the same reason:
	`adminUser` lets a superuser look up any user's record, and which AI
	clients someone has authorized is theirs to see — `FORBIDDEN`, not an
	empty list, for anyone but the user themselves (superusers included).
	Filters out anything already past its TTL, since DynamoDB's deletion
	lags real expiry.
	"""
	oauthGrants: [OauthGrant!]!
	"""
	Every (non-deleted) instance this user belongs to, and their role in
	each — the instance switcher's data source, and also what the admin
	user page uses to show a looked-up user's memberships (see this
	field's use from `adminUser`: reusing it here, rather than adding a
	superuser-only duplicate, keeps "which instances is this user a
	member of" defined in exactly one resolver). Deleted instances are
	filtered out — see `SCHEMA.md`'s instance soft-delete section for why
	this, not a DB-level filter, is where that happens. Same
	defence-in-depth guard as [`Self::passkeys`] used to be — unlike
	passkeys, a superuser may read it too: reading who belongs to which
	instance (not the credentials themselves) is the thing a superuser
	legitimately needs `adminUser` for. Anyone else gets `FORBIDDEN` —
	`Instance.members` and `Ticket.assignee` hand any member a colleague's
	`User`, and which *other* instances (other tenants) that colleague
	belongs to is none of their business.
	"""
	memberships: [MembershipInfo!]!
}

"""
`vehicleKmSummary`: the caller's own cents-per-km trips in one financial
year, against the ATO's 5,000 km cap. Informational — nothing enforces
the cap.
"""
type VehicleKmSummary {
	"""
	The calendar year the financial year starts in (`2026` = FY
	2026–27, 1 July 2026 – 30 June 2027).
	"""
	financialYear: Int!
	"""
	`"2026–27"`.
	"""
	financialYearLabel: String!
	"""
	Total distance, as a decimal string (`"1240.5"`).
	"""
	totalKm: String!
	"""
	The ATO cap: 5,000 km per car per financial year.
	"""
	capKm: Int!
	"""
	This financial year's ATO rate, or `null` if the built-in table has
	none for it yet.
	"""
	rateCentsPerKm: Int
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: QueryRoot
	mutation: MutationRoot
}
