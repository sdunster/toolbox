type Invoice {
	id: ID!
	status: InvoiceStatusType!
	number: Int
	"""
	Zero-padded to 3 digits (`"008"`); `null` for a draft. Mirrors
	`invoicing::snapshot::InvoiceSnapshot::display_number` exactly.
	"""
	displayNumber: String
	"""
	`YYYY-MM-DD`; `null` for a draft.
	"""
	issueDate: String
	"""
	`YYYY-MM-DD`: when the invoice was settled — paid in full, or
	paid and credited down to nothing. `null` while anything is owed.
	Never printed on the invoice.
	"""
	paidDate: String
	"""
	`YYYY-MM-DD`; `null` for a draft. Frozen at finalization.
	"""
	dueDate: String
	"""
	Unpaid and past its due date, by today's UTC date.
	"""
	overdue: Boolean!
	"""
	Whole days past due (by today's UTC date) while unpaid; `null` when
	it isn't overdue.
	"""
	daysOverdue: Int
	"""
	Payments recorded against it, oldest first.
	"""
	payments: [InvoicePaymentInfo!]!
	paidCents: Int!
	"""
	Sum of its credit notes, GST-inclusive.
	"""
	creditedCents: Int!
	"""
	Total − credited − paid. Negative when overpaid. `0` for a draft.
	"""
	balanceCents: Int!
	"""
	Credit notes issued against it, newest (highest number) first.
	"""
	creditNotes: [CreditNote!]!
	"""
	When `sendInvoice` last mailed it (Unix seconds); `null` if never.
	"""
	sentAt: Int
	"""
	Who it was last mailed to.
	"""
	sentTo: [String!]!
	"""
	Dataloaded — see `TicketMessage::author`'s doc comment.
	"""
	project: Project!
	"""
	This invoice's current items — live rows fetched by `item_ids`, for
	both a draft and a finalized invoice (never from the snapshot, which
	carries frozen `InvoiceLine`s, not `BillableItem`s). A strongly
	consistent `BatchGetItem` (`get_billable_items_consistent`), not the
	(eventually consistent) `get_billable_items` — a mutation that just
	attached these items (`createInvoice`/`addInvoiceItems`) returns this
	field in the same response, and each item is handed this invoice as
	its known parent, so `status`/`invoice` resolve from it directly
	rather than the (also eventually consistent) dataloader path.
	"""
	items: [BillableItem!]!
	"""
	"Tax Invoice" or "Invoice" — see [`Self::effective`].
	"""
	title: String!
	billTo: InvoiceBillToInfo!
	reference: String
	seller: InvoiceSellerInfo!
	lines: [InvoiceLineInfo!]!
	subtotalCents: Int!
	gstCents: Int!
	totalCents: Int!
	currency: String!
	gstRegistered: Boolean!
	paymentDetails: String
	createdAt: Int!
