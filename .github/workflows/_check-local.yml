name: Local stack check (reusable)
on:
  workflow_call:

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  local_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust toolchain (pinned by api/rust-toolchain.toml)
        run: |
          channel=$(sed -nE 's/^channel *= *"(.*)"/\1/p' api/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      # local/*.sh are the two pieces of the local stack with no other coverage
      # at all: nothing compiles them and nothing type-checks them.
      - name: Shellcheck the local stack scripts
        run: shellcheck local/*.sh

      # No .mjs scripts exist in local/ yet (mail fixtures land in a later
      # step), but check for them rather than hardcoding a path that doesn't
      # exist yet, so this step starts working the moment one does.
      - name: Check local/ scripts parse
        run: |
          shopt -s nullglob
          files=(local/*.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no .mjs files under local/ yet"
          else
            for f in "${files[@]}"; do node --check "$f"; done
          fi

      # JSON-only invariants of local/seed/synthetic.json (token hashes match
      # their documented plaintexts, referenced ids resolve, every address is
      # @example.com/@toolbox.test) — no DB, so this runs before the local
      # stack comes up.
      - name: Seed fixture invariants
        run: cd api && cargo test --locked --test seed_fixtures

      # The part that genuinely needs a database. api/src/bin/local-tables.rs is
      # transcribed by hand from infra/dynamodb.tf, so this is what catches the
      # two drifting apart.
      - name: Install DynamoDB Local
        run: make local-fetch
      - name: Start DynamoDB Local
        run: make local-up
      - name: Create tables
        run: make local-tables
      - name: Every expected table exists
        run: make local-tables-check
      # _check-api.yml runs `cargo test` with no database, so every
      # *_dynamodb_local.rs test skips itself there. This is the run where they
      # actually execute. Every test uses nanoid-unique ids, so running before
      # the seed step is harmless. Built without debuginfo: with it, every test
      # target together is ~29 GB, more than a hosted runner's disk; a failing
      # assertion still reports its file and line.
      - name: API tests against DynamoDB Local
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: |
          set -a && . local/local.env && set +a
          cd api && cargo test --locked --no-fail-fast
      - name: Seed fixtures
        run: make local-seed
      - name: Stop DynamoDB Local
        if: always()
        run: make local-down
