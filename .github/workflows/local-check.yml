name: Local stack check
on:
  pull_request:
    paths:
      - 'local/**'
      # Any API change: this workflow is where the *_dynamodb_local tests run.
      - 'api/**'
      - 'infra/dynamodb.tf'
      - 'Makefile'
      - '.github/workflows/local-check.yml'
      - '.github/workflows/_check-local.yml'

jobs:
  local_check:
    uses: ./.github/workflows/_check-local.yml
